<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #1d1d1f;
  --text2: #6e6e73;
  --line: rgba(0,0,0,.09);
  --fill: rgba(120,120,128,.12);
  --fill-strong: rgba(120,120,128,.2);
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --on-accent: #ffffff;
  --link: #0066cc;
  --good: #1d7f3a;
  --warn: #a64b00;
  --bad: #d70015;
  --glass: rgba(245,245,247,.74);
  --sheet: #f5f5f7;
  --sheet-card: #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06);
  --lg-tint: rgba(255,255,255,.34);
  --lg-rim: rgba(255,255,255,.95);
  --lg-rim-soft: rgba(255,255,255,.18);
  --lg-sheen: rgba(255,255,255,.42);
  --lg-shadow: 0 12px 34px rgba(0,0,0,.13), 0 2px 6px rgba(0,0,0,.07), inset 0 0 0 .5px rgba(0,0,0,.07);
  --lens: rgba(120,120,128,.15);
  --lens-press: rgba(255,255,255,.38);
  --spring: cubic-bezier(.3,1.4,.5,1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --text2: #a1a1a6;
    --line: rgba(255,255,255,.13); --fill: rgba(120,120,128,.24); --fill-strong: rgba(120,120,128,.36);
    --accent: #2997ff; --accent-hover: #4aa8ff; --on-accent: #001a33; --link: #2997ff;
    --good: #30d158; --warn: #ff9f0a; --bad: #ff6961;
    --glass: rgba(0,0,0,.72); --sheet: #1c1c1e; --sheet-card: #2c2c2e;
    --shadow: 0 0 0 1px rgba(255,255,255,.06);
    --lg-tint: rgba(36,36,40,.42); --lg-rim: rgba(255,255,255,.42); --lg-rim-soft: rgba(255,255,255,.06);
    --lg-sheen: rgba(255,255,255,.12); --lg-shadow: 0 12px 34px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
    --lens: rgba(255,255,255,.13); --lens-press: rgba(255,255,255,.2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --text2: #a1a1a6;
  --line: rgba(255,255,255,.13); --fill: rgba(120,120,128,.24); --fill-strong: rgba(120,120,128,.36);
  --accent: #2997ff; --accent-hover: #4aa8ff; --on-accent: #001a33; --link: #2997ff;
  --good: #30d158; --warn: #ff9f0a; --bad: #ff6961;
  --glass: rgba(0,0,0,.72); --sheet: #1c1c1e; --sheet-card: #2c2c2e;
  --shadow: 0 0 0 1px rgba(255,255,255,.06);
    --lg-tint: rgba(36,36,40,.42); --lg-rim: rgba(255,255,255,.42); --lg-rim-soft: rgba(255,255,255,.06);
    --lg-sheen: rgba(255,255,255,.12); --lg-shadow: 0 12px 34px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
    --lens: rgba(255,255,255,.13); --lens-press: rgba(255,255,255,.2);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 17px/1.4706 var(--font); letter-spacing: -.022em;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Layout ---------- */
.shell { min-height: 100dvh; }
.sidebar { display: none; }
.main { max-width: 1040px; margin: 0 auto; padding: 0 16px calc(96px + var(--safe-b)); }

.topbar {
  position: sticky; top: 0; z-index: 20;
  padding-top: var(--safe-t);
  background: transparent; border-bottom: 1px solid transparent;
  transition: background .25s, border-color .25s;
}
.topbar.scrolled {
  background: var(--glass); border-bottom-color: var(--line);
  -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
}
.topbar-in { max-width: 1040px; margin: 0 auto; padding: 8px 16px; min-height: 52px; display: flex; align-items: center; gap: 10px; }
.tb-title { font-weight: 600; font-size: 17px; opacity: 0; transition: opacity .2s; }
.topbar.scrolled .tb-title { opacity: 1; }
.grow { flex: 1; }

.pill {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
  border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--text2); white-space: nowrap;
  background: var(--lg-tint); box-shadow: inset 0 1px 0 var(--lg-rim), inset 0 0 0 .5px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.06);
  -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%);
  transition: transform .3s var(--spring);
}
.pill:active { transform: scale(.94); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--text2); display: block; }
.pill[data-s="ok"] i { background: #34c759; }
.pill[data-s="syncing"] i { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.pill[data-s="pending"] i { background: #ff9500; }
.pill[data-s="error"] i { background: #ff3b30; }
@keyframes pulse { 50% { opacity: .25; } }

.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; transition: background .15s, transform .35s var(--spring);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.12), 0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent);
}
.icon-btn:hover { background: var(--accent-hover); }
.icon-btn:active { transform: scale(.88); }
.icon-btn[hidden] { display: none; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-btn svg.i { width: 20px; height: 20px; stroke-width: 2.2; }

.brand { display: none; }
/* Liquid Glass: kapsul kaca mengambang + lensa elastis */
.tabbar {
  --h: 64px; --pad: 5px;
  position: fixed; z-index: 30; left: 50%; bottom: calc(12px + var(--safe-b));
  width: min(calc(100% - 28px), 440px); height: var(--h); padding: var(--pad);
  transform: translateX(-50%); border-radius: 999px; isolation: isolate;
  background: var(--lg-tint); box-shadow: var(--lg-shadow);
  -webkit-backdrop-filter: blur(12px) saturate(190%) brightness(1.04);
  backdrop-filter: blur(12px) saturate(190%) brightness(1.04);
  touch-action: none; user-select: none; -webkit-user-select: none;
  transition: height .5s var(--spring), width .5s var(--spring), transform .5s var(--spring);
}
.tabbar.refract { -webkit-backdrop-filter: url(#lg-filter); backdrop-filter: url(#lg-filter); }
.tabbar::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 4;
  background: linear-gradient(140deg, var(--lg-rim), var(--lg-rim-soft) 38%, var(--lg-rim-soft) 62%, var(--lg-rim));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.tabbar::after {
  content: ""; position: absolute; inset: 1px; border-radius: inherit; pointer-events: none; z-index: 0;
  background: linear-gradient(180deg, var(--lg-sheen), transparent 48%), radial-gradient(90% 120% at 50% 130%, var(--lg-sheen), transparent 60%);
  opacity: .9;
}
.tabbar.press { transform: translateX(-50%) scale(1.02); }
.lens {
  position: absolute; z-index: 1; top: var(--pad); bottom: var(--pad); left: var(--pad); width: 80px;
  border-radius: 999px; background: var(--lens);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.55), inset 0 -1px 1px rgba(255,255,255,.12);
  transform: translateX(var(--lx, 0px)) scale(var(--ls, 1));
  transition: transform .55s var(--spring), background .25s, box-shadow .25s;
  will-change: transform;
}
.tabbar.press .lens {
  --ls: 1.13; background: var(--lens-press);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 2px rgba(255,255,255,.35), 0 6px 22px rgba(0,0,0,.16);
}
.tabbar.drag .lens { transition: transform .14s cubic-bezier(.2,.8,.3,1), background .25s, box-shadow .25s; }
.tabs { position: relative; z-index: 3; display: flex; height: 100%; }
.tab {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-size: 11px; font-weight: 600; letter-spacing: -.01em; color: var(--text); border-radius: 999px;
  transition: color .25s, transform .4s var(--spring);
}
.tab span { transition: opacity .2s, max-height .4s var(--spring); line-height: 1.3; max-height: 22px; overflow: hidden; white-space: nowrap; }
.tab[aria-current="page"], .tab.hot { color: var(--accent); }
.tabbar.drag .tab[aria-current="page"]:not(.hot) { color: var(--text); }
.tab.hot svg.i { transform: scale(1.12); }
.tab svg.i { transition: transform .4s var(--spring); }
.tabbar.mini { --h: 50px; width: min(calc(100% - 96px), 300px); }
.tabbar.mini .tab span { opacity: 0; max-height: 0; }

/* ---------- Page header ---------- */
.page-head { padding: 4px 0 18px; }
.page-head h1 { font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.03em; }
.page-head p { color: var(--text2); font-size: 15px; margin-top: 2px; }

.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 32px 0 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -.025em; }

.monthnav { display: inline-flex; align-items: center; background: var(--fill); border-radius: 999px; padding: 2px; }
.monthnav button { height: 32px; min-width: 32px; display: grid; place-items: center; border-radius: 999px; color: var(--accent); }
.monthnav button:hover { background: var(--fill); }
.monthnav .ml { padding: 0 10px; font-size: 15px; font-weight: 600; color: var(--text); min-width: 124px; text-align: center; }
.monthnav svg.i { width: 18px; height: 18px; stroke-width: 2.4; }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden; color: #f5f5f7; border-radius: 28px; padding: 26px 24px 22px;
  background:
    radial-gradient(70% 90% at 100% 0%, rgba(41,151,255,.42), transparent 62%),
    radial-gradient(60% 70% at 0% 100%, rgba(175,82,222,.30), transparent 60%),
    #0a0a0c;
  border: 1px solid rgba(255,255,255,.08);
}
.hero .lbl { font-size: 15px; font-weight: 500; color: rgba(245,245,247,.72); }
.hero .big { font-size: clamp(40px, 11vw, 64px); line-height: 1.05; font-weight: 700; letter-spacing: -.04em; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.hero .big.neg { color: #ff8a80; }
.hero .barwrap { margin: 16px 0 6px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.16); overflow: hidden; }
.hero .barwrap i { display: block; height: 100%; border-radius: 99px; background: #f5f5f7; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.hero .barcap { font-size: 13px; color: rgba(245,245,247,.72); }
.hero .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.14); }
.hero .stat small { display: block; font-size: 12px; color: rgba(245,245,247,.66); line-height: 1.25; }
.hero .stat b { display: block; font-size: 15px; overflow-wrap: anywhere; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.hero .actions { display: flex; gap: 10px; margin-top: 20px; }
.hero .actions .btn { padding: 0 16px; font-size: 15px; flex: 1 1 auto; }
.hero .stats { align-items: start; }
.btn { height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .15s; }
.btn:active { transform: scale(.97); }
.btn.light { background: #f5f5f7; color: #1d1d1f; }
.btn.light:hover { background: #fff; }
.btn.ghost { background: rgba(255,255,255,.16); color: #f5f5f7; }
.btn.ghost:hover { background: rgba(255,255,255,.24); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.plain { background: var(--fill); color: var(--text); }
.btn.danger { background: var(--fill); color: var(--bad); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn svg.i { width: 18px; height: 18px; stroke-width: 2.2; }

.notice { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 14px 16px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); font-size: 15px; }
.notice p { flex: 1; color: var(--text2); }
.notice b { color: var(--text); font-weight: 600; }
.link { color: var(--link); font-weight: 500; }
.link:hover { text-decoration: underline; }

/* ---------- Envelope cards ---------- */
.envs { display: grid; gap: 12px; grid-template-columns: 1fr; }
.env {
  text-align: left; background: var(--card); border-radius: 22px; padding: 18px 18px 16px; box-shadow: var(--shadow);
  display: block; width: 100%; transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s;
}
.env:hover { transform: translateY(-2px); }
.env:active { transform: scale(.975); }
.row:active { background: var(--fill-strong); }
.env-top { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.env-top .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.env-top .pc { color: var(--text2); font-weight: 500; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.env-note { font-size: 13px; color: var(--text2); margin-top: 1px; min-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.env-bal { font-size: 30px; font-weight: 700; letter-spacing: -.035em; margin: 10px 0 10px; font-variant-numeric: tabular-nums; }
.env-bal.neg { color: var(--bad); }
.bar { height: 6px; border-radius: 99px; background: var(--fill); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--c); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.env-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--text2); }
.env-meta b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.flag { margin-top: 10px; font-size: 13px; font-weight: 600; }
.flag.bad { color: var(--bad); } .flag.warn { color: var(--warn); }

/* ---------- Lists ---------- */
.summary { background: var(--card); border-radius: 22px; padding: 18px 20px; box-shadow: var(--shadow); }
.summary small { color: var(--text2); font-size: 14px; }
.summary .v { font-size: 34px; font-weight: 700; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px; margin: 0 -16px; padding-inline: 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--fill); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
.chip[aria-checked="true"], .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.chip .dot { width: 8px; height: 8px; }
.date-h { margin: 22px 4px 8px; font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .02em; display: flex; justify-content: space-between; }
.group { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }

<script>
(() => {
'use strict';

/* =====================================================================
   Konstanta & util
   ===================================================================== */
const LS_KEY = 'budgetsaver.v1';
const MAX_CATS = 10;
const PALETTE = ['#0a84ff', '#30b856', '#ff9500', '#af52de', '#ff375f', '#32ade6', '#d9a600', '#5e5ce6', '#a2845e', '#2fa4a9'];
const DEFAULT_CATS = [
  { name: 'Personal Care', note: 'Sabun, skincare, potong rambut' },
  { name: 'Primary Needs', note: 'Makan, transport, kebutuhan pokok' },
  { name: 'To Invest', note: 'Dana yang disisihkan untuk investasi' },
  { name: 'AI Subscription', note: 'Langganan tools AI' }
];
const ERR = {
  unauthorized: 'Token salah.',
  token_belum_diatur: 'API_TOKEN di Code.gs belum diganti.',
  nama_kategori_sudah_ada: 'Nama kategori sudah dipakai.',
  kategori_tidak_ditemukan: 'Kategori tidak ditemukan di Sheets.'
};
const errText = (c) => {
  if (ERR[c]) return ERR[c];
  if (/^kategori_masih_dipakai/.test(c)) return 'Kategori masih dipakai.';
  if (/^maksimal_/.test(c)) return 'Maksimal ' + MAX_CATS + ' kategori.';
  if (/Sheet ".+" belum ada/.test(c)) return 'Sheet belum siap. Deploy ulang Code.gs terbaru (New version).';
  if (c === 'skrip_tidak_terikat_sheet') return 'Buat skrip dari Google Sheet: Extensions → Apps Script.';
  return c;
};

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n) => String(n).padStart(2, '0');
const dstr = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const sum = (a) => a.reduce((s, x) => s + x.amount, 0);
const nf = new Intl.NumberFormat('id-ID');
const fmt = (n) => (n < 0 ? '−' : '') + 'Rp ' + nf.format(Math.abs(Math.round(n)));
const pdate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const monthLabel = (m) => { const [y, mo] = m.split('-').map(Number); return new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(new Date(y, mo - 1, 1)); };
const shiftMonth = (m, k) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + k, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const dayLabel = (s) => {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return 'Tanpa tanggal';
  const t = today(), y = dstr(new Date(Date.now() - 864e5));
  const base = new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long' }).format(pdate(s));
  return s === t ? 'Hari ini · ' + base : s === y ? 'Kemarin · ' + base : base;
};

const IC = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  out: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
  in: '<path d="M17 7 7 17"/><path d="M17 17H7V7"/>',
  set: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  map: '<circle cx="12" cy="12" r="2.6"/><circle cx="4.5" cy="5.5" r="1.9"/><circle cx="4.5" cy="18.5" r="1.9"/><circle cx="19.5" cy="5.5" r="1.9"/><circle cx="19.5" cy="18.5" r="1.9"/><path d="M10 10.3 6 7M10 13.7 6 17M14 10.3 18 7M14 13.7 18 17"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  left: '<path d="M15 6l-6 6 6 6"/>',
  right: '<path d="M9 6l6 6-6 6"/>'
};
const svg = (k) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

/* =====================================================================
   State & persistensi
   ===================================================================== */
const blank = () => ({ v: 1, cats: DEFAULT_CATS.map((c) => ({ ...c })), topups: [], expenses: [], queue: [], cfg: { url: '', token: '' }, theme: 'auto', lastCat: '', lastSync: 0 });
let S = blank();
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = { ...blank(), ...JSON.parse(raw) }; } catch (e) { /* penyimpanan tidak tersedia */ }
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* abaikan */ } };

const ui = {
  tab: 'home',
  month: today().slice(0, 7),
  filter: { expense: '', topup: '' },
  mmOpen: new Set(),
  mmJust: '',
  sync: { state: 'idle', msg: '' }
};
const connected = () => !!(S.cfg.url && S.cfg.token);

/* =====================================================================
   Mutasi (lokal dulu, antrean ke Sheets bila terhubung)
   ===================================================================== */
function applyLocal(op) {
  const listOf = (k) => (k === 'topup' ? S.topups : S.expenses);
  switch (op.t) {
    case 'add': case 'upd': {
      const list = listOf(op.k); const i = list.findIndex((x) => x.id === op.row.id);
      if (i >= 0) list[i] = { ...op.row }; else list.push({ ...op.row });
      break;
    }
    case 'del': { const list = listOf(op.k); const i = list.findIndex((x) => x.id === op.id); if (i >= 0) list.splice(i, 1); break; }
    case 'catAdd':
      if (!S.cats.some((c) => c.name.toLowerCase() === op.name.toLowerCase())) S.cats.push({ name: op.name, note: op.note || '' });
      break;
    case 'catUpd': {
      const c = S.cats.find((x) => x.name === op.from);
      if (c) { c.name = op.name; c.note = op.note || ''; }
      if (op.from !== op.name) [...S.topups, ...S.expenses].forEach((t) => { if (t.category === op.from) t.category = op.name; });
      if (S.lastCat === op.from) S.lastCat = op.name;
      Object.keys(ui.filter).forEach((k) => { if (ui.filter[k] === op.from) ui.filter[k] = op.name; });
      break;
    }
    case 'catDel': S.cats = S.cats.filter((c) => c.name !== op.name); break;
  }
}
function mutate(op) {
  applyLocal(op);
  if (connected()) S.queue.push(op);
  save(); render(); scheduleSync(350);
}

/* =====================================================================
   Sinkronisasi dengan Apps Script
   ===================================================================== */
let syncing = false, syncTimer = 0;
const setSync = (state, msg = '') => { ui.sync = { state, msg }; renderChrome(); if (ui.tab === 'settings') renderMain(); };

async function api(body) {
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(S.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: S.cfg.token, ...body }), signal: ctrl.signal });
    const text = await r.text();
    try { return JSON.parse(text); } catch (e) { throw new Error('Respons tidak valid. Cek URL /exec.'); }
  } finally { clearTimeout(to); }
}
function scheduleSync(ms = 400) { if (!connected()) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }

async function sync() {
  if (!connected() || syncing) return;
  if (!navigator.onLine) { setSync('offline'); return; }
  syncing = true; setSync('syncing');
  const sent = S.queue.slice();
  try {
    const res = await api({ action: 'sync', ops: sent });
    if (!res.ok) { setSync('error', errText(res.error)); return; }
    S.queue.splice(0, sent.length);
    const bad = (res.results || []).find((r) => !r.ok);
    if (bad) toast('Ditolak Sheets: ' + errText(bad.error));
    S.cats = res.data.categories; S.topups = res.data.topups; S.expenses = res.data.expenses;
    S.queue.forEach(applyLocal); // perubahan yang dibuat selagi menunggu tetap terlihat
    S.lastSync = Date.now(); save();
    setSync('ok'); render();
    if (S.queue.length) scheduleSync(100);
  } catch (e) {
    const net = e.name === 'AbortError' || e instanceof TypeError || !navigator.onLine;
    setSync(net ? 'offline' : 'error', net ? 'Offline — dikirim saat online.' : e.message);
  } finally { syncing = false; }
}

const colorOf = (name) => { const i = S.cats.findIndex((c) => c.name === name); return i < 0 ? '#8e8e93' : PALETTE[i % PALETTE.length]; };
function compute(month) {
  const names = S.cats.map((c) => c.name);
  [...S.topups, ...S.expenses].forEach((t) => { if (!names.includes(t.category)) names.push(t.category); });
  const rows = names.map((name) => {
    const cat = S.cats.find((c) => c.name === name);
    const topup = sum(S.topups.filter((t) => t.category === name));
    const ex = S.expenses.filter((t) => t.category === name);
    const spent = sum(ex), spentMonth = sum(ex.filter((t) => t.date.startsWith(month)));
    const saldo = topup - spent;
    return { name, note: cat ? cat.note : 'Tidak ada di daftar Kategori', color: colorOf(name), topup, spent, spentMonth, saldo, pct: topup > 0 ? Math.max(0, Math.min(1, saldo / topup)) : 0 };
  });
  const T = rows.reduce((a, r) => ({ topup: a.topup + r.topup, spent: a.spent + r.spent, spentMonth: a.spentMonth + r.spentMonth, saldo: a.saldo + r.saldo }), { topup: 0, spent: 0, spentMonth: 0, saldo: 0 });
  T.pct = T.topup > 0 ? Math.max(0, Math.min(1, T.saldo / T.topup)) : 0;
  return { rows, T };
}
function runningBalances() {
  const map = {}, cum = {};
  S.expenses.map((e, i) => ({ e, i })).sort((a, b) => (a.e.date < b.e.date ? -1 : a.e.date > b.e.date ? 1 : a.i - b.i)).forEach(({ e }) => {
    cum[e.category] = (cum[e.category] || 0) + e.amount;
    map[e.id] = sum(S.topups.filter((t) => t.category === e.category && t.date <= e.date)) - cum[e.category];
  });
  return map;
}
const catSaldo = (name, ignore) => sum(S.topups.filter((t) => t.category === name)) - sum(S.expenses.filter((t) => t.category === name && t.id !== ignore));
const useCount = (name) => [...S.topups, ...S.expenses].filter((t) => t.category === name).length;

/* ---------- Liquid Glass tab bar ---------- */
const bar = $('#tabbar'), lens = $('#lens');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const tabEls = () => [...bar.querySelectorAll('.tab')];
let lensIdx = -1, drag = null;

function lensTo(i, mode) {
  const t = tabEls()[i]; if (!t) return;
  const x = t.offsetLeft, w = t.offsetWidth;
  const from = parseFloat(lens.style.getPropertyValue('--lx'));
  lens.style.width = w + 'px';
  if (mode === 'liquid' && !reduceMotion.matches && lens.animate && isFinite(from) && Math.abs(from - x) > 1) {
    lens.style.transition = 'none';
    lens.style.setProperty('--lx', x + 'px');
    const a = lens.animate([
      { transform: `translateX(${from}px) scale(1)` },
      { transform: `translateX(${(from + x) / 2}px) scale(1.24, .8)`, offset: .42 },
      { transform: `translateX(${x}px) scale(1)` }
    ], { duration: 560, easing: 'cubic-bezier(.3,1.25,.5,1)' });
    a.onfinish = a.oncancel = () => { lens.style.transition = ''; };
  } else if (mode === 'jump' || reduceMotion.matches) {
    lens.style.transition = 'none';
    lens.style.setProperty('--lx', x + 'px');
    void lens.offsetWidth; lens.style.transition = '';
  } else {
    lens.style.setProperty('--lx', x + 'px'); // pegas CSS
  }
  lensIdx = i;
}

function lensFollow(clientX) {
  const tabs = tabEls(), host = $('#tabs').getBoundingClientRect();
  const w = lens.offsetWidth, max = host.width - w;
  let x = clientX - host.left - w / 2;
  if (x < 0) x *= .28; else if (x > max) x = max + (x - max) * .28; // tarikan karet di ujung
  lens.style.setProperty('--lx', x + 'px');
  const c = x + w / 2;
  let hot = 0, best = Infinity;
  tabs.forEach((t, i) => { const d = Math.abs(c - (t.offsetLeft + t.offsetWidth / 2)); if (d < best) { best = d; hot = i; } });
  tabs.forEach((t, i) => t.classList.toggle('hot', i === hot && bar.classList.contains('drag')));
  return hot;
}

bar.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || openState) return;
  drag = { id: e.pointerId, x0: e.clientX, moved: false, hot: lensIdx };
  try { bar.setPointerCapture(e.pointerId); } catch (err) { /* abaikan */ }
  bar.classList.add('press');
  drag.hot = lensFollow(e.clientX);
});
bar.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.abs(e.clientX - drag.x0) > 6) { drag.moved = true; bar.classList.add('drag'); }
  drag.hot = lensFollow(e.clientX);
});
function endDrag(e, commit) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const target = commit ? drag.hot : lensIdx;
  drag = null;
  bar.classList.remove('press', 'drag');
  tabEls().forEach((t) => t.classList.remove('hot'));
  lensTo(target);
  if (commit && TABS[target] && TABS[target].id !== ui.tab) go(TABS[target].id);
}
bar.addEventListener('pointerup', (e) => endDrag(e, true));
bar.addEventListener('pointercancel', (e) => endDrag(e, false));
bar.addEventListener('lostpointercapture', (e) => endDrag(e, false));
if (window.ResizeObserver) new ResizeObserver(() => { if (!drag && lensIdx >= 0) lensTo(lensIdx, 'jump'); }).observe(bar);

// Refraksi tepi kaca (Chromium: Edge/Chrome di Windows). Safari tetap memakai blur biasa.
(function setupRefraction() {
  const ua = navigator.userAgent;
  const chromium = /Chrome\//.test(ua) && !/CriOS|FxiOS|EdgiOS|iPhone|iPad|iPod/.test(ua); // Safari tidak mendukung url() di backdrop-filter
  if (!chromium || matchMedia('(prefers-reduced-transparency: reduce)').matches) return;
  const fe = $('#lg-map');
  const draw = () => {
    const w = Math.round(bar.offsetWidth), h = Math.round(bar.offsetHeight);
    if (!w || !h) return;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'), img = ctx.createImageData(w, h), r = h / 2, edge = Math.min(12, r * .5);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const cx = Math.min(Math.max(x + .5, r), w - r), dx = x + .5 - cx, dy = y + .5 - r;
      const dist = Math.hypot(dx, dy), inside = r - dist;
      const k = inside > 0 && inside < edge ? Math.pow(1 - inside / edge, 2) : 0;
      const nx = dist ? dx / dist : 0, ny = dist ? dy / dist : 0, o = (y * w + x) * 4;
      img.data[o] = 128 - nx * k * 127; img.data[o + 1] = 128 - ny * k * 127; img.data[o + 2] = 128; img.data[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    fe.setAttribute('href', c.toDataURL()); fe.setAttribute('width', w); fe.setAttribute('height', h);
  };
  let raf = 0;
  if (window.ResizeObserver) new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }).observe(bar);
  draw();
  bar.classList.add('refract');
})();

/* ---------- Peta: model ---------- */
let mmGroups = {};
const noteKey = (n) => { const v = String(n || '').trim(); return v && v !== '-' ? v.toLowerCase().replace(/\s+/g, ' ') : ''; };
const pctTxt = (x) => (x > 0 && x < .005 ? '<1%' : Math.round(x * 100) + '%');
const lineW = (share) => (1.25 + 6 * Math.max(0, Math.min(1, share))).toFixed(2);

function mapSide(list, kind) {
  const total = sum(list);
  const byCat = new Map();
  list.forEach((t) => { if (!byCat.has(t.category)) byCat.set(t.category, []); byCat.get(t.category).push(t); });
  const cats = [...byCat].map(([name, items]) => {
    const amount = sum(items);
    const g = new Map();
    items.forEach((t) => {
      const k = noteKey(t.note);
      if (!g.has(k)) g.set(k, { key: k, label: k ? String(t.note).trim() : 'Tanpa keterangan', items: [] });
      g.get(k).items.push(t);
    });
    const groups = [...g.values()].map((x) => ({ ...x, amount: sum(x.items) }))
      .sort((a, b) => b.amount - a.amount || a.label.localeCompare(b.label));
    return { name, amount, share: total ? amount / total : 0, groups };
  }).sort((a, b) => b.amount - a.amount || a.name.localeCompare(b.name));
  return { kind, total, cats };
}

function mapSideHtml(s, dir) {
  const title = dir === 'in' ? 'Masuk' : 'Keluar';
  if (!s.cats.length) {
    return `<div class="mm-side ${dir}"><div class="mm-h">${title}</div>
      <div class="mm-none" id="mm-${dir}-none" data-p="mm-c" data-w="1.5" data-c="#8e8e93" data-dash="1">Belum ada ${dir === 'in' ? 'top up' : 'pengeluaran'} bulan ini</div></div>`;
  }
  const cats = s.cats.map((c, i) => {
    const key = dir + '|' + c.name, moreKey = key + '|more';
    const open = ui.mmOpen.has(key), all = ui.mmOpen.has(moreKey);
    const isNew = !!ui.mmJust && ui.mmJust.startsWith(key);
    const id = `mm-${dir}-${i}`, col = colorOf(c.name);
    let kids = '';
    if (open) {
      const shown = all || c.groups.length <= 6 ? c.groups : c.groups.slice(0, 5);
      const rest = c.groups.slice(shown.length);
      kids = shown.map((g, j) => {
        const gk = key + '|' + g.key;
        mmGroups[gk] = { kind: s.kind, cat: c.name, label: g.label, ids: g.items.map((t) => t.id) };
        const share = c.amount ? g.amount / c.amount : 0;
        return `<button class="mm-node leaf${isNew ? ' new' : ''}" id="${id}-${j}" data-p="${id}" data-w="${lineW(share)}" data-c="${col}" data-act="mmleaf" data-g="${esc(gk)}" style="--c:${col}">
          <span class="mm-t">${esc(g.label)}${g.items.length > 1 ? ` <em>${g.items.length}×</em>` : ''}</span>
          <span class="mm-v">${fmt(g.amount)} · ${pctTxt(share)}</span></button>`;
      }).join('');
      if (rest.length) {
        const ra = sum(rest.flatMap((g) => g.items));
        kids += `<button class="mm-node more${isNew ? ' new' : ''}" id="${id}-more" data-p="${id}" data-w="1.25" data-c="${col}" data-act="mmtoggle" data-k="${esc(moreKey)}" style="--c:${col}">
          <span class="mm-t">Lainnya <em>${rest.length}</em></span><span class="mm-v">${fmt(ra)} · ${pctTxt(c.amount ? ra / c.amount : 0)}</span></button>`;
      } else if (all && c.groups.length > 6) {
        kids += `<button class="mm-node more" id="${id}-less" data-act="mmtoggle" data-k="${esc(moreKey)}"><span class="mm-t">Ringkas</span></button>`;
      }
    }
    return `<div class="mm-branch${open ? ' open' : ''}">
      <button class="mm-node cat" id="${id}" data-p="mm-c" data-w="${lineW(c.share)}" data-c="${col}" data-act="mmtoggle" data-k="${esc(key)}" aria-expanded="${open}" style="--c:${col}">
        <span class="mm-t"><i class="dot"></i>${esc(c.name)}</span>
        <span class="mm-v">${fmt(c.amount)} · ${pctTxt(c.share)}</span>
        <svg class="i mm-chev" viewBox="0 0 24 24" aria-hidden="true">${IC.right}</svg>
      </button>
      ${kids ? `<div class="mm-kids">${kids}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="mm-side ${dir}"><div class="mm-h">${title}<b>${fmt(s.total)}</b></div>${cats}</div>`;
}

    ${mapSideHtml(outs, 'out')}

}

/* ---------- Peta: garis penghubung ---------- */
function drawMap(animate) {
  const box = $('#mm'), lines = $('#mm-lines');
  if (!box || !lines) return;
  const B = box.getBoundingClientRect();
  const W = Math.ceil(box.scrollWidth), H = Math.ceil(box.scrollHeight);
  lines.setAttribute('width', W); lines.setAttribute('height', H); lines.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const horiz = matchMedia('(min-width: 1100px)').matches;
  const rect = (el) => { const r = el.getBoundingClientRect(); return { l: r.left - B.left, r: r.right - B.left, t: r.top - B.top, b: r.bottom - B.top, cy: (r.top + r.bottom) / 2 - B.top }; };
  const out = [];
  box.querySelectorAll('[data-p]').forEach((el) => {
    const par = document.getElementById(el.dataset.p);
    if (!par) return;
    const a = rect(par), b = rect(el);
    const dir = el.closest('.mm-side').classList.contains('in') ? 'in' : 'out';
    let d;
    if (horiz) {
      const x0 = dir === 'out' ? a.r : a.l, x1 = dir === 'out' ? b.l : b.r, mx = (x0 + x1) / 2;
      d = `M${x0} ${a.cy}C${mx} ${a.cy} ${mx} ${b.cy} ${x1} ${b.cy}`;
    } else {
      const up = b.cy < a.cy, x0 = a.l + 16, y0 = up ? a.t : a.b, x1 = b.l, y1 = b.cy;
      const r = Math.max(0, Math.min(12, Math.abs(y1 - y0) / 2, (x1 - x0) / 2)), sgn = up ? -1 : 1;
      d = `M${x0} ${y0}V${y1 - sgn * r}Q${x0} ${y1} ${x0 + r} ${y1}H${x1}`;
    }
    const cls = [el.dataset.p === 'mm-c' ? '' : 'k', animate && el.classList.contains('new') ? 'grow' : '', el.dataset.dash ? 'dash' : ''].join(' ').trim();
    const w = horiz ? el.dataset.w : (el.dataset.w * .75).toFixed(2);
    out.push(`<path d="${d}" class="${cls}" ${cls.includes('grow') ? 'pathLength="1"' : ''} style="stroke:${el.dataset.c};stroke-width:${w}px"/>`);
  });
  lines.innerHTML = out.join('');
}

function openSheet(html, { onClose, dialog } = {}) {

  layer.innerHTML = `<div class="backdrop" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" ${dialog ? 'aria-label="Konfirmasi"' : ''}>${html}</div>`;
  const b = $('.backdrop', layer), s = $('.sheet', layer);
  requestAnimationFrame(() => { b.classList.add('open'); s.classList.add('open'); });
  openState = { prev, onClose };
  document.body.style.overflow = 'hidden';

function closeSheet(instant) {
  if (!openState) return;
  const st = openState; openState = null;
  const b = $('.backdrop', layer), s = $('.sheet', layer);
  document.body.style.overflow = '';
  const done = () => { layer.innerHTML = ''; };
  if (instant || !b) done(); else { b.classList.remove('open'); s.classList.remove('open'); setTimeout(() => { if (!openState) done(); }, 320); }
  try { st.prev && st.prev.focus && st.prev.focus({ preventScroll: true }); } catch (e) { /* abaikan */ }
  if (st.onClose) st.onClose();
}
function confirmDialog({ title, message, ok, danger, cancel = 'Batal' }) {

/* =====================================================================
   Koneksi, tautan penyiapan, ekspor
   ===================================================================== */
const URL_OK = /^https:\/\/script\.google(usercontent)?\.com\//i;
const URL_DEV = /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//i;

function keepInputs(url, token) {
  const u = $('#cfg-url'), t = $('#cfg-token');
  if (u) u.value = url; if (t) t.value = token;
}
async function connect(url, token) {
  url = url.trim(); token = token.trim();
  if (!URL_OK.test(url) && !URL_DEV.test(url)) { toast('URL harus dari script.google.com'); return false; }
  if (!token) { toast('Token kosong'); return false; }
  const old = { ...S.cfg };
  S.cfg = { url, token };
  setSync('syncing');
  try {
    const res = await api({ action: 'sync', ops: [] });
    if (!res.ok) { S.cfg = old; setSync(old.url ? 'ok' : 'idle'); keepInputs(url, token); toast(errText(res.error)); return false; }
    const localCount = S.topups.length + S.expenses.length;
    let upload = false;
    if (localCount && !old.url) {
      upload = await confirmDialog({ title: 'Unggah data lokal?', message: `${localCount} catatan ada di perangkat ini.`, ok: 'Unggah', cancel: 'Pakai data Sheets' });
    }
    if (upload) {
      const ops = [];
      S.cats.forEach((c) => ops.push({ t: 'catAdd', name: c.name, note: c.note }));
      S.topups.forEach((row) => ops.push({ t: 'add', k: 'topup', row }));
      S.expenses.forEach((row) => ops.push({ t: 'add', k: 'expense', row }));
      S.queue = ops;
    } else {
      S.queue = [];
      S.cats = res.data.categories; S.topups = res.data.topups; S.expenses = res.data.expenses;
    }
    save(); setSync('idle'); render(); toast('Terhubung');
    sync();
    return true;
  } catch (e) {
    S.cfg = old; setSync(old.url ? 'ok' : 'idle'); keepInputs(url, token);
    toast(e.name === 'AbortError' || e instanceof TypeError ? 'Gagal terhubung. Cek URL & akses "Anyone".' : e.message);
    return false;
  }
}
const b64 = (s) => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = (s) => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));

async function importHashConfig() {
  const m = location.hash.match(/^#cfg=(.+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  await applyCfgCode(m[1]);
}
async function applyCfgCode(code) {
  try {
    const { u, t } = JSON.parse(unb64(code));
    if (!URL_OK.test(u) && !URL_DEV.test(u)) throw new Error('bad');
    const host = new URL(u).host;
    const ok = await confirmDialog({ title: 'Hubungkan?', message: `Ke ${host}. Lanjut hanya jika tautan dari Anda.`, ok: 'Hubungkan' });
    if (ok) { if (await connect(u, t)) go('home'); }
  } catch (e) { toast('Tautan penyiapan tidak valid'); }
}

function exportCsv() {
  const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [['Jenis', 'Tanggal', 'Kategori', 'Keterangan', 'Jumlah'].map(q).join(',')];
  S.topups.forEach((t) => lines.push([q('Top Up'), q(t.date), q(t.category), q(t.note), t.amount].join(',')));
  S.expenses.forEach((t) => lines.push([q('Pengeluaran'), q(t.date), q(t.category), q(t.note), t.amount].join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'budget-saver-' + today() + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

   ===================================================================== */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'tab': go(d.tab); break;
    case 'month': ui.month = d.k === '0' ? today().slice(0, 7) : shiftMonth(ui.month, Number(d.k)); renderMain(); break;
    case 'env': ui.filter.expense = d.cat; go('expense'); break;
    case 'filter': ui.filter[ui.tab] = d.cat; renderMain(); break;
    case 'new': openTxForm(d.kind); break;
    case 'edit': openTxForm(d.kind, d.id); break;
    case 'mmtoggle': {
      const k = d.k;
      if (ui.mmOpen.has(k)) { ui.mmOpen.delete(k); ui.mmJust = ''; } else { ui.mmOpen.add(k); ui.mmJust = k; }
      renderMain(); break;
    }
    case 'mmleaf': openGroupPanel(d.g); break;
    case 'cat': openCatForm(d.cat); break;
    case 'newcat': openCatForm(); break;
    case 'close': closeSheet(); break;
    case 'theme': S.theme = d.v; save(); applyTheme(); renderMain(); break;
    case 'connect': await connect($('#cfg-url').value, $('#cfg-token').value); break;
    case 'syncnow': sync(); break;
    case 'disconnect':
      if (await confirmDialog({ title: 'Putuskan?', message: 'Data di Sheets tetap aman.', ok: 'Putuskan', danger: true })) {
        S.cfg = { url: '', token: '' }; S.queue = []; save(); setSync('idle'); render(); toast('Mode lokal');
      }
      break;
    case 'copylink': {
      const link = location.origin + location.pathname + '#cfg=' + b64(JSON.stringify({ u: S.cfg.url, t: S.cfg.token }));
      try { await navigator.clipboard.writeText(link); toast('Tautan disalin'); } catch (err) { window.prompt('Salin tautan ini:', link); }
      break;
    }
    case 'uselink': {
      const m = ($('#cfg-link').value || '').match(/cfg=([A-Za-z0-9_-]+)/);
      if (!m) { toast('Tautan tidak dikenali'); break; }
      await applyCfgCode(m[1]); break;
    }
    case 'csv': exportCsv(); break;
    case 'wipe':
      if (await confirmDialog({ title: 'Hapus data lokal?', message: 'Tidak bisa dibatalkan.', ok: 'Hapus', danger: true })) {
        S.topups = []; S.expenses = []; save(); render(); toast('Dihapus');
      }
      break;
  }
});
$('#add-btn').title = 'Pengeluaran baru (N)';
$('#add-btn').addEventListener('click', () => { if (ui.tab === 'topup') openTxForm('topup'); else if (ui.tab === 'settings') openCatForm(); else openTxForm('expense'); });
$('#pill').addEventListener('click', () => { if (connected()) sync(); else go('settings'); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && openState) { closeSheet(); return; }
  const t = e.target;
  if (e.key.toLowerCase() === 'n' && !e.metaKey && !e.ctrlKey && !e.altKey && !openState && !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) { e.preventDefault(); openTxForm('expense'); }
});
let lastY = window.scrollY;
const wide = matchMedia('(min-width: 900px)');
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  $('#topbar').classList.toggle('scrolled', y > 36);
  if (!wide.matches && !drag) {
    if (y > 140 && y - lastY > 8) bar.classList.add('mini');
    else if (lastY - y > 8 || y < 80) bar.classList.remove('mini');
  }
  lastY = y;
}, { passive: true });
wide.addEventListener('change', () => bar.classList.remove('mini'));
window.addEventListener('online', () => scheduleSync(200));
let mmRaf = 0;
window.addEventListener('resize', () => { if (ui.tab === 'map') { cancelAnimationFrame(mmRaf); mmRaf = requestAnimationFrame(() => drawMap(false)); } });
window.addEventListener('offline', () => renderChrome());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleSync(200); });
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 90000);

function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
  const dark = S.theme === 'dark' || (S.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#meta-theme').setAttribute('content', dark ? '#000000' : '#f5f5f7');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* =====================================================================
   Start
   ===================================================================== */
buildNav();
applyTheme();
const h = location.hash.match(/^#\/(home|expense|topup|map|settings)$/);
if (h) ui.tab = h[1];
render();
importHashConfig().then(() => scheduleSync(50));
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__bs = { S, ui, sync, compute }; // untuk pengujian
})();
</script>
